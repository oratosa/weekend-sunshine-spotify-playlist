name: Deploy Python Function to Cloud Run Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run Functions
        uses: google-github-actions/deploy-cloud-functions@v4
        with:
          name: 'weekend-sunshine-spotify-playlist'
          project_id: '${{ vars.GCP_PROJECT_ID }}'
          region: 'asia-northeast1'
          runtime: 'python313'
          entry_point: 'fetch_and_save_weekend_sunshine_nhk_identifier_groups'
          environment: 'GEN_2'
          secrets: 'NHK_API_KEY=projects/${{ vars.GCP_PROJECT_ID }}/secrets/NHK_API_KEY/versions/latest'
